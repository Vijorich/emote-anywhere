name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches-ignore:
      # release-please PRs come from GITHUB_TOKEN; their workflow runs wait
      # for approval and die as "failure" when the PR merges. Main runs the
      # same checks on the merged commit right after.
      - 'release-please--**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check commit subjects
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-commits.mjs "origin/${{ github.base_ref }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-commits.mjs "${{ github.event.before }}..HEAD"
          else
            node scripts/check-commits.mjs "HEAD~1..HEAD"
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:firefox
      - run: pnpm lint:firefox
