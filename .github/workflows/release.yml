name: Release

# Manual rebuild tool: dispatch it on a v<version> tag to repackage a release
# and re-attach the store zips. Normal releases are packaged by
# release-please.yml directly (a GITHUB_TOKEN-created tag does not trigger
# `on: push: tags`).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Wait for the public registry
        run: |
          url=$(sed -n 's/^WXT_DEFAULT_REGISTRY_URL=//p' .env.production)
          for _ in $(seq 1 20); do
            if curl -fsS "$url" >/dev/null; then exit 0; fi
            sleep 15
          done
          echo "Registry is not reachable: $url" >&2
          exit 1

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm zip

      - run: pnpm zip:firefox

      # No body/body_path: the release and its notes already exist; this only
      # uploads the zips to it.
      - uses: softprops/action-gh-release@v3
        with:
          files: .output/*.zip
